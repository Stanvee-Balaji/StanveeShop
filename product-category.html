<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4fbf8b',
                        'primary-dull': '#44ab7a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/app.css" />
</head>

<body class="bg-white">

    <!--
  ===== converted from ProductCategory.jsx =====
  React Router's useParams() -> here we read ?category=... from the URL.
  e.g. product-category.html?category=vegetables
-->
    <div class="mt-5 md:mt-16 px-2 md:px-4">

        <!-- Category Title -->
        <div id="category-title" class="flex flex-col items-end w-max hidden">
            <p id="category-title-text" class="text-2xl font-medium"></p>
            <div class="w-16 h-0.5 bg-primary rounded-full"></div>
        </div>

        <!-- Products Grid -->
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-6 lg:grid-cols-5 mt-6">
            <!-- skeletons / cards / empty-state injected by JS -->
        </div>
    </div>

    <script src="assets/app-data.js"></script>
    <script>
        const grid = document.getElementById("product-grid");
        const titleWrap = document.getElementById("category-title");
        const titleText = document.getElementById("category-title-text");

        const params = new URLSearchParams(window.location.search);
        const category = (params.get("category") || "").toLowerCase(); // mirrors useParams().category

        const searchCategory = App.CATEGORIES.find(
            item => item.path.toLowerCase() === category
        );

        if (searchCategory) {
            titleText.textContent = searchCategory.text.toUpperCase();
            titleWrap.classList.remove("hidden");
        }

        function renderSkeletons() {
            grid.innerHTML = "";
            for (let i = 0; i < 10; i++) grid.appendChild(App.createProductSkeleton());
        }

        function renderProducts(products) {
            grid.innerHTML = "";

            const filtered = products.filter(
                product => product.category.toLowerCase() === category
            );

            if (filtered.length > 0) {
                filtered.forEach(p => grid.appendChild(App.createProductCard(p)));
            } else {
                grid.innerHTML = `
        <div class="col-span-full flex items-center justify-center h-[60vh]">
          <p class="text-2xl font-medium text-primary">No Products found in this category.</p>
        </div>`;
            }
        }

        // simulate the async product fetch your context normally does
        renderSkeletons();
        setTimeout(() => {
            renderProducts(App.PRODUCTS);
        }, 500);
    </script>
</body>

</html>
