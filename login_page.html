<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – StanveeProducts</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/app.css" />


    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4fbf8b',
                        'primary-dull': '#44ab7a'
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes sv-slide-up {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        #sv-toast {
            animation: sv-slide-up 0.3s ease forwards;
        }
        /* Tab styles */
        
        .auth-tab {
            flex: 1;
            padding: 10px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #6b7280;
            transition: color .2s, border-color .2s;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
        }
        
        .auth-tab.active {
            color: #4fbf8b;
            border-bottom: 2px solid #4fbf8b;
        }
        
        .auth-panel {
            display: none;
        }
        
        .auth-panel.active {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Input label */
        
        .field-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }
        
        .field-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color .2s;
        }
        
        .field-input:focus {
            border-color: #4fbf8b;
        }
        /* Divider */
        
        .or-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            font-size: 12px;
        }
        
        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
    </style>
</head>

<body>

    <div id="header"></div>

    <!-- AUTH CARD -->
    <main class="bg-gray-50 min-h-[70vh] flex items-center justify-center px-4 py-16">
        <div id="authCard" class="w-80 sm:w-[380px] bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden">

            <!-- Tabs -->
            <div class="flex border-b border-gray-200 px-6 pt-6">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>

            </div>

            <div class="px-6 pb-8 pt-5">

                <!-- ── LOGIN PANEL ── -->
                <div id="panel-login" class="auth-panel active">


                    <div>
                        <p class="field-label">Email</p>
                        <input type="email" id="login-email" class="field-input" placeholder="you@example.com" autocomplete="email" />
                    </div>
                    <div>
                        <p class="field-label">Password</p>
                        <input type="password" id="login-password" class="field-input" placeholder="Your password" autocomplete="current-password" />
                    </div>

                    <p id="login-error" class="text-xs text-red-500 hidden"></p>

                    <button id="login-btn" onclick="handleLogin()" class="bg-primary hover:bg-primary-dull transition-all text-white w-full py-2.5 rounded-lg font-semibold text-sm flex items-center justify-center gap-2">
                        <svg id="login-spinner" class="hidden animate-spin h-4 w-4 text-white"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                        </svg>
                        <span id="login-btn-text">Login</span>
                    </button>


                </div>



            </div>
        </div>
    </main>


    <!-- site script (for nav helpers) -->
    <script src="script.js"></script>

    <script>
        /* ── Safety-net stubs ── */
        if (typeof toggleMobileSearch !== "function")
            window.toggleMobileSearch = () => document.getElementById("mobileSearchRow").classList.toggle("open");
        if (typeof clearMobileSearch !== "function")
            window.clearMobileSearch = () => {
                document.getElementById("mobileSearch").value = "";
            };
        if (typeof toggleCat !== "function")
            window.toggleCat = () => document.getElementById("catDropdown").classList.toggle("open");
        if (typeof toggleMobileMenu !== "function")
            window.toggleMobileMenu = () => document.getElementById("mobileNavMenu").classList.toggle("open");
        if (typeof toggleProfile !== "function")
            window.toggleProfile = () => document.getElementById("profileDropdown").classList.toggle("open");

        /* ── API base URL ── */
        const API_BASE = "https://api.stanvee.com";

        /* ── If already logged in, skip to home ── */
        (function checkAlreadyLoggedIn() {
            const raw = localStorage.getItem("sv_user");
            if (raw) {
                try {
                    const u = JSON.parse(raw);
                    if (u && u.id) window.location.replace("index.html");
                } catch (_) {}
            }
        })();

        /* ── Reflect nav state ── */
        function refreshNavUser() {
            const raw = localStorage.getItem("sv_user");
            const guestNav = document.getElementById("guestNav");
            const userNav = document.getElementById("userNav");
            if (raw) {
                try {
                    const user = JSON.parse(raw);
                    if (guestNav) guestNav.style.display = "none";
                    if (userNav) userNav.style.display = "flex";
                    const walletEl = document.getElementById("walletAmt");
                    // if (walletEl) walletEl.textContent = user.walletBalance ? ? 0;
                } catch (_) {
                    if (guestNav) guestNav.style.display = "block";
                    if (userNav) userNav.style.display = "none";
                }
            } else {
                if (guestNav) guestNav.style.display = "block";
                if (userNav) userNav.style.display = "none";
            }
        }
        refreshNavUser();

        function logout() {
            localStorage.removeItem("sv_user");
            window.location.href = "index.html";
        }
        window.logout = logout;



        /* ── Toast ── */
        function showToast(msg, type) {
            const old = document.getElementById("sv-toast");
            if (old) old.remove();
            const t = document.createElement("div");
            t.id = "sv-toast";
            t.textContent = msg;
            Object.assign(t.style, {
                position: "fixed",
                bottom: "28px",
                left: "50%",
                transform: "translateX(-50%)",
                background: type === "error" ? "#ef4444" : "#4fbf8b",
                color: "#fff",
                padding: "13px 28px",
                borderRadius: "8px",
                fontSize: "15px",
                fontFamily: "'Outfit', sans-serif",
                fontWeight: "500",
                boxShadow: "0 4px 20px rgba(0,0,0,0.18)",
                zIndex: "99999",
                whiteSpace: "nowrap",
                pointerEvents: "none"
            });
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.transition = "opacity 0.35s ease";
                t.style.opacity = "0";
            }, 2500);
            return t;
        }

        /* ── Save user to localStorage ── */
        function saveUser(user) {
            localStorage.setItem("sv_user", JSON.stringify(user));
        }

        /* ── Redirect after success ── */
        function redirectHome(user) {
            const firstName = (user.name || "there").split(" ")[0];
            const toast = showToast(`Welcome, ${firstName}! Redirecting…`);
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1800);
        }

        /* ────────────────────────────────────
           LOGIN HANDLER
        ──────────────────────────────────── */
        async function handleLogin() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const errorEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");
            const btnText = document.getElementById("login-btn-text");
            const spinner = document.getElementById("login-spinner");

            errorEl.classList.add("hidden");

            if (!email || !password) {
                errorEl.textContent = "Please enter your email and password.";
                errorEl.classList.remove("hidden");
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.classList.add("opacity-70");
            btnText.textContent = "Logging in…";
            spinner.classList.remove("hidden");

            try {
                const res = await fetch(`${API_BASE}/api/user/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                const data = await res.json();

                if (!data.success) {
                    errorEl.textContent = data.message || "Invalid email or password.";
                    errorEl.classList.remove("hidden");
                    return;
                }

                saveUser(data.user);
                redirectHome(data.user);

            } catch (err) {
                console.error("Login error:", err);
                errorEl.textContent = "Could not reach the server. Please try again.";
                errorEl.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.classList.remove("opacity-70");
                btnText.textContent = "Login";
                spinner.classList.add("hidden");
            }
        }



        /* ── Allow Enter key to submit ── */
        document.addEventListener("keydown", function(e) {
            if (e.key !== "Enter") return;
            handleLogin();
        });
    </script>
    <div id="footer"></div>
    <script src="js/script.js"></script>
    <script src="js/app-data.js"></script>
    <script src="js/include.js"></script>
</body>

</html>
