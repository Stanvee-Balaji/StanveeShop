<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — Stanvee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ---- Small additions, kept in the same visual language as style.css ---- */
        .cat-loader-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }
        .cat-spinner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            animation: cat-spin 0.8s linear infinite;
        }
        @keyframes cat-spin {
            to { transform: rotate(360deg); }
        }
        .cat-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: border-color .15s ease, transform .15s ease;
            background: var(--card-bg, #fff);
        }
        .cat-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .cat-error, .cat-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13.5px;
        }
        .cat-retry-btn {
            margin-top: 10px;
            border: 1px solid var(--border);
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
            font-size: 12.5px;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ---- Product drill-down panel ---- */
        #cat-panel-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.35);
            z-index: 999;
        }
        #cat-panel {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(560px, 100%);
            background: #fff;
            z-index: 1000;
            display: none;
            flex-direction: column;
            box-shadow: -8px 0 24px rgba(0,0,0,.12);
        }
        .cat-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cat-panel-title {
            font-weight: 700;
            font-size: 15px;
        }
        .cat-panel-close {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            color: var(--text-muted);
        }
        .cat-panel-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .cat-panel-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .cat-panel-controls select, .cat-panel-controls input {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12.5px;
            font-family: inherit;
        }
        .cat-product-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .cat-product-row img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--accent-light);
            flex-shrink: 0;
        }
        .cat-product-name {
            font-weight: 600;
            font-size: 13px;
        }
        .cat-product-meta {
            font-size: 11.5px;
            color: var(--text-muted);
        }
        .cat-product-price {
            margin-left: auto;
            text-align: right;
            font-size: 13px;
            font-weight: 700;
        }
        .cat-product-mrp {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 400;
        }
        .cat-stock-badge {
            display: inline-block;
            margin-top: 2px;
            font-size: 10.5px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 5px;
        }
        .cat-stock-in { background: #e6f6ea; color: #1a8a3e; }
        .cat-stock-out { background: #fdeaea; color: #c93b3b; }
        .cat-panel-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            font-size: 12.5px;
        }
        .cat-panel-pagination button {
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .cat-panel-pagination button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ---- Category priority controls (new) ---- */
        .cat-priority-toggle {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12.5px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: auto;
        }
        .cat-priority-toggle.active {
            background: var(--accent-light);
            color: var(--accent);
            border-color: var(--accent);
        }
        .cat-priority-editor {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }
        .cat-priority-editor input {
            width: 52px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 11.5px;
            font-family: inherit;
        }
        .cat-priority-editor button {
            border: 1px solid var(--border);
            background: var(--accent-light);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .cat-priority-editor button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .cat-priority-status {
            font-size: 10.5px;
            margin-left: 2px;
        }
        .cat-priority-status.ok { color: #1a8a3e; }
        .cat-priority-status.err { color: #c93b3b; }
        .cat-priority-badge {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 5px;
            background: #eef1ff;
            color: #3b4bc9;
            margin-left: 6px;
        }
        .cat-priority-badge.none {
            background: var(--border);
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <!-- ============================================================
     APP SHELL — sidebar + topbar markup is identical on every page.
     No JS: the mobile menu uses a hidden checkbox (#sb-toggle) and
     the Products dropdown uses a native <details> element.
============================================================= -->
    <div id="app-shell">
        <input type="checkbox" id="sb-toggle">
        <label for="sb-toggle" class="sb-overlay"></label>
<!-- ---------- SIDEBAR (shared component, injected by components/layout.js) ---------- -->
        <div id="sidebar-mount"></div>
        <div id="main-wrap">
            <!-- ---------- TOPBAR ---------- -->
            <!-- <header id="header">
                <div class="flex" style="align-items:center;gap:10px;">
                    <label for="sb-toggle" class="hamburger"><svg class="icon" width="22" height="22" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></label>
                    <div class="breadcrumb"><b>Categories</b></div>
                </div>
                <div class="header-right">
                    <div class="profile-btn">
                        <div class="profile-avatar">A</div>
                        <span class="profile-name">Admin User</span>
                    </div>
                </div>
            </header> -->

            <!-- ---------- PAGE CONTENT ---------- -->
            <main id="content">
                <div class="page-title">Categories</div>
                <div class="page-sub">Categories currently used across your catalog</div>

                <!-- Categories grid — populated dynamically via JS -->
                <div class="card" style="padding:16px 20px;">
                    <div id="categories-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
                        <!-- loader shown here initially -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ---------- PRODUCT DRILL-DOWN PANEL ---------- -->
    <div id="cat-panel-overlay"></div>
    <div id="cat-panel">
        <div class="cat-panel-header">
            <div class="cat-panel-title" id="cat-panel-title">Category</div>
            <button class="cat-panel-close" id="cat-panel-close">&#10005;</button>
        </div>
        <div class="cat-panel-body">
            <div class="cat-panel-controls">
                <select id="cat-sortBy">
                    <option value="productName">Name</option>
                    <option value="offerPrice">Price</option>
                    <option value="mrp">MRP</option>
                </select>
                <select id="cat-sortDir">
                    <option value="asc">Asc</option>
                    <option value="desc">Desc</option>
                </select>
                <input type="number" id="cat-minPrice" placeholder="Min price" style="width:100px;">
                <input type="number" id="cat-maxPrice" placeholder="Max price" style="width:100px;">
                <button type="button" class="cat-priority-toggle" id="cat-priority-mode-btn" title="Show products ordered by category priority">Priority order</button>
            </div>
            <div id="cat-panel-content"><!-- products / loader / empty / error --></div>
            <div class="cat-panel-pagination" id="cat-panel-pagination" style="display:none;">
                <button id="cat-page-prev">&larr; Prev</button>
                <span id="cat-page-info"></span>
                <button id="cat-page-next">Next &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = "https://api.stanvee.com";
    </script>
    <script src="components/layout.js"></script>
    <script>
        // ================= CONFIG =================
        const BASE_URL = "https://api.stanvee.com";

        function getAdminToken() {
            return localStorage.getItem("adminSessionToken") || "";
        }

        function authHeaders() {
            return { "Authorization": getAdminToken() };
        }

        // ================= CATEGORY SUMMARY =================
        const gridEl = document.getElementById("categories-grid");

        function categoryIconSVG() {
            return `<svg class="icon" width="15" height="15" viewBox="0 0 24 24">
                <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
                <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
            </svg>`;
        }

        function showGridLoader() {
            gridEl.style.display = "block";
            gridEl.innerHTML = `<div class="cat-loader-wrap" style="grid-column:1/-1;"><div class="cat-spinner"></div></div>`;
        }

        function showGridError(message, onRetry) {
            gridEl.style.display = "block";
            gridEl.innerHTML = `
                <div class="cat-error" style="grid-column:1/-1;">
                    ${message}
                    <div><button class="cat-retry-btn" id="cat-retry-btn">Retry</button></div>
                </div>`;
            document.getElementById("cat-retry-btn").addEventListener("click", onRetry);
        }

        function showGridEmpty() {
            gridEl.style.display = "block";
            gridEl.innerHTML = `<div class="cat-empty" style="grid-column:1/-1;">No categories found yet.</div>`;
        }

        async function loadCategorySummary() {
            showGridLoader();
            try {
                const res = await fetch(`${BASE_URL}/api/admin/products/categories/summary`, {
                    method: "GET",
                    headers: authHeaders()
                });

                if (res.status === 401) {
                    showGridError("Session expired. Please log in again.", loadCategorySummary);
                    return;
                }

                if (!res.ok) {
                    showGridError("Something went wrong while loading categories.", loadCategorySummary);
                    return;
                }

                const json = await res.json();

                if (json.status !== "success" || !Array.isArray(json.data)) {
                    showGridError("Unexpected response from server.", loadCategorySummary);
                    return;
                }

                if (json.data.length === 0) {
                    showGridEmpty();
                    return;
                }

                renderCategoryGrid(json.data);
            } catch (err) {
                console.error("Category summary fetch failed:", err);
                showGridError("Could not reach the server. Check your connection.", loadCategorySummary);
            }
        }

        function renderCategoryGrid(categories) {
            gridEl.style.display = "grid";
            gridEl.innerHTML = "";
            categories.forEach(cat => {
                const card = document.createElement("div");
                card.className = "cat-card";
                card.innerHTML = `
                    <div class="flex" style="align-items:center;gap:8px;margin-bottom:8px;">
                        <div style="width:32px;height:32px;border-radius:8px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;">
                            ${categoryIconSVG()}
                        </div>
                        <div style="font-weight:700;font-size:13.5px;">${escapeHTML(cat.category)}</div>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);">${cat.product_count} products</div>
                `;
                card.addEventListener("click", () => openCategoryPanel(cat.category));
                gridEl.appendChild(card);
            });
        }

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        // ================= CATEGORY PRODUCT PANEL =================
        const panelOverlay = document.getElementById("cat-panel-overlay");
        const panel = document.getElementById("cat-panel");
        const panelTitle = document.getElementById("cat-panel-title");
        const panelContent = document.getElementById("cat-panel-content");
        const panelPagination = document.getElementById("cat-panel-pagination");
        const pageInfo = document.getElementById("cat-page-info");
        const prevBtn = document.getElementById("cat-page-prev");
        const nextBtn = document.getElementById("cat-page-next");
        const sortByEl = document.getElementById("cat-sortBy");
        const sortDirEl = document.getElementById("cat-sortDir");
        const minPriceEl = document.getElementById("cat-minPrice");
        const maxPriceEl = document.getElementById("cat-maxPrice");
        const priorityModeBtn = document.getElementById("cat-priority-mode-btn");

        let currentCategory = null;
        let currentPage = 0;
        const pageSize = 10;
        let priorityMode = false; // false = normal paginated listing (unchanged), true = new category_priority ordered view
        const priorityModePerCategory = 100; // how many products to pull per category from the grouped endpoint

        function openCategoryPanel(category) {
            currentCategory = category;
            currentPage = 0;
            priorityMode = false;
            updatePriorityModeUI();
            panelTitle.textContent = category;
            panelOverlay.style.display = "block";
            panel.style.display = "flex";
            fetchCategoryProducts();
        }

        function updatePriorityModeUI() {
            priorityModeBtn.classList.toggle("active", priorityMode);
            priorityModeBtn.textContent = priorityMode ? "Priority order ✓" : "Priority order";
            // sort/price filters only apply to the existing paginated listing endpoint,
            // the new category-wise endpoint doesn't accept them, so hide them in priority mode
            [sortByEl, sortDirEl, minPriceEl, maxPriceEl].forEach(el => {
                el.style.display = priorityMode ? "none" : "";
            });
        }

        priorityModeBtn.addEventListener("click", () => {
            priorityMode = !priorityMode;
            currentPage = 0;
            updatePriorityModeUI();
            fetchCategoryProducts();
        });

        function closeCategoryPanel() {
            panelOverlay.style.display = "none";
            panel.style.display = "none";
            currentCategory = null;
        }

        document.getElementById("cat-panel-close").addEventListener("click", closeCategoryPanel);
        panelOverlay.addEventListener("click", closeCategoryPanel);

        [sortByEl, sortDirEl].forEach(el => el.addEventListener("change", () => {
            currentPage = 0;
            fetchCategoryProducts();
        }));

        let priceDebounce;
        [minPriceEl, maxPriceEl].forEach(el => el.addEventListener("input", () => {
            clearTimeout(priceDebounce);
            priceDebounce = setTimeout(() => {
                currentPage = 0;
                fetchCategoryProducts();
            }, 400);
        }));

        prevBtn.addEventListener("click", () => {
            if (currentPage > 0) {
                currentPage--;
                fetchCategoryProducts();
            }
        });
        nextBtn.addEventListener("click", () => {
            currentPage++;
            fetchCategoryProducts();
        });

        function showPanelLoader() {
            panelContent.innerHTML = `<div class="cat-loader-wrap"><div class="cat-spinner"></div></div>`;
            panelPagination.style.display = "none";
        }

        function showPanelError(message) {
            panelContent.innerHTML = `
                <div class="cat-error">
                    ${message}
                    <div><button class="cat-retry-btn" id="cat-panel-retry-btn">Retry</button></div>
                </div>`;
            panelPagination.style.display = "none";
            document.getElementById("cat-panel-retry-btn").addEventListener("click", fetchCategoryProducts);
        }

        function showPanelEmpty() {
            panelContent.innerHTML = `<div class="cat-empty">No products found in this category${(minPriceEl.value || maxPriceEl.value) ? " for the selected price range" : ""}.</div>`;
            panelPagination.style.display = "none";
        }

        async function fetchCategoryProducts() {
            if (!currentCategory) return;
            if (priorityMode) {
                return fetchCategoryProductsByPriority();
            }
            showPanelLoader();

            const params = new URLSearchParams({
                page: currentPage,
                size: pageSize,
                sortBy: sortByEl.value,
                sortDir: sortDirEl.value
            });
            if (minPriceEl.value) params.set("minPrice", minPriceEl.value);
            if (maxPriceEl.value) params.set("maxPrice", maxPriceEl.value);

            try {
                const res = await fetch(
                    `${BASE_URL}/api/admin/products/categories/${encodeURIComponent(currentCategory)}?${params.toString()}`,
                    { method: "GET", headers: authHeaders() }
                );

                if (res.status === 401) {
                    showPanelError("Session expired. Please log in again.");
                    return;
                }

                if (!res.ok) {
                    showPanelError("Something went wrong while loading products.");
                    return;
                }

                const json = await res.json();

                if (json.status !== "success" || !Array.isArray(json.data)) {
                    showPanelError("Unexpected response from server.");
                    return;
                }

                if (json.data.length === 0) {
                    showPanelEmpty();
                    return;
                }

                renderPanelProducts(json.data);
                renderPagination(json.current_page, json.total_pages, json.total_products);
            } catch (err) {
                console.error("Category products fetch failed:", err);
                showPanelError("Could not reach the server. Check your connection.");
            }
        }

        // Uses the NEW admin endpoint: GET /api/admin/products/category-wise?perCategory=N
        // This is the only endpoint that returns products ordered by `category_priority`.
        // It returns every category in one response, so we pull out the group matching
        // the currently open category and render just that (no pagination/sort/price
        // params — the endpoint doesn't support them, unlike the existing listing API).
        async function fetchCategoryProductsByPriority() {
            showPanelLoader();
            panelPagination.style.display = "none";

            try {
                const res = await fetch(
                    `${BASE_URL}/api/admin/products/category-wise?perCategory=${priorityModePerCategory}`,
                    { method: "GET", headers: authHeaders() }
                );

                if (res.status === 401) {
                    showPanelError("Session expired. Please log in again.");
                    return;
                }

                if (!res.ok) {
                    showPanelError("Something went wrong while loading priority order.");
                    return;
                }

                const json = await res.json();

                if (json.status !== "success" || !Array.isArray(json.data)) {
                    showPanelError("Unexpected response from server.");
                    return;
                }

                const group = json.data.find(g => g.category === currentCategory);
                const products = group && Array.isArray(group.products) ? group.products : [];

                if (products.length === 0) {
                    showPanelEmpty();
                    return;
                }

                renderPanelProducts(products);
            } catch (err) {
                console.error("Priority order fetch failed:", err);
                showPanelError("Could not reach the server. Check your connection.");
            }
        }

        function renderPanelProducts(products) {
            panelContent.innerHTML = products.map(p => {
                const inStock = (p.stock_status || "").toLowerCase() === "in_stock";
                const pid = p.product_id || "";
                const hasPriority = p.category_priority !== undefined && p.category_priority !== null;
                return `
                    <div class="cat-product-row" data-product-id="${escapeHTML(pid)}">
                        <img src="${escapeHTML(p.image || '')}" alt="" onerror="this.style.visibility='hidden'">
                        <div style="flex:1;min-width:0;">
                            <div class="cat-product-name">
                                ${escapeHTML(p.product_name)}
                                <span class="cat-priority-badge ${hasPriority ? '' : 'none'}" data-role="priority-badge">
                                    ${hasPriority ? 'Priority ' + escapeHTML(p.category_priority) : 'No priority'}
                                </span>
                            </div>
                            <div class="cat-product-meta">${escapeHTML(pid)}</div>
                            <span class="cat-stock-badge ${inStock ? 'cat-stock-in' : 'cat-stock-out'}">
                                ${inStock ? 'In stock' : 'Out of stock'}${p.stock_quantity ? ' · ' + escapeHTML(p.stock_quantity) : ''}
                            </span>
                            <div class="cat-priority-editor">
                                <input type="number" min="0" step="1" placeholder="Priority"
                                       data-role="priority-input"
                                       value="${hasPriority ? escapeHTML(p.category_priority) : ''}">
                                <button type="button" data-role="priority-save">Save</button>
                                <button type="button" data-role="priority-clear">Clear</button>
                                <span class="cat-priority-status" data-role="priority-status"></span>
                            </div>
                        </div>
                        <div class="cat-product-price">
                            ₹${escapeHTML(p.offer_price)}
                            ${p.mrp && p.mrp !== p.offer_price ? `<div class="cat-product-mrp">₹${escapeHTML(p.mrp)}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Event delegation: handles Save/Clear clicks for every row, including rows
        // re-rendered after pagination/sorting/mode changes.
        panelContent.addEventListener("click", (e) => {
            const btn = e.target.closest('[data-role="priority-save"], [data-role="priority-clear"]');
            if (!btn) return;

            const row = btn.closest(".cat-product-row");
            const productId = row.dataset.productId;
            const input = row.querySelector('[data-role="priority-input"]');
            const isClear = btn.dataset.role === "priority-clear";

            const rawValue = isClear ? "" : input.value.trim();
            setProductPriority(productId, rawValue, row);
        });

        // PUT /api/admin/products/{productId}/priority?priority=N  (new endpoint)
        // Omitting the priority param clears it. Independent of the `featured` flag entirely.
        async function setProductPriority(productId, rawValue, rowEl) {
            const statusEl = rowEl.querySelector('[data-role="priority-status"]');
            const badgeEl = rowEl.querySelector('[data-role="priority-badge"]');
            const inputEl = rowEl.querySelector('[data-role="priority-input"]');
            const buttons = rowEl.querySelectorAll('[data-role="priority-save"], [data-role="priority-clear"]');

            if (rawValue !== "" && (isNaN(rawValue) || Number(rawValue) < 0 || !Number.isInteger(Number(rawValue)))) {
                statusEl.textContent = "Must be 0 or a positive whole number";
                statusEl.className = "cat-priority-status err";
                return;
            }

            buttons.forEach(b => b.disabled = true);
            statusEl.textContent = "Saving…";
            statusEl.className = "cat-priority-status";

            const query = rawValue === "" ? "" : `?priority=${encodeURIComponent(rawValue)}`;

            try {
                const res = await fetch(
                    `${BASE_URL}/api/admin/products/${encodeURIComponent(productId)}/priority${query}`,
                    { method: "PUT", headers: authHeaders() }
                );

                if (res.status === 401) {
                    statusEl.textContent = "Session expired";
                    statusEl.className = "cat-priority-status err";
                    return;
                }

                if (res.status === 400) {
                    statusEl.textContent = "category_priority must be zero or a positive whole number";
                    statusEl.className = "cat-priority-status err";
                    return;
                }

                if (!res.ok) {
                    statusEl.textContent = "Failed to save";
                    statusEl.className = "cat-priority-status err";
                    return;
                }

                statusEl.textContent = "Saved";
                statusEl.className = "cat-priority-status ok";

                if (rawValue === "") {
                    badgeEl.textContent = "No priority";
                    badgeEl.classList.add("none");
                    inputEl.value = "";
                } else {
                    badgeEl.textContent = `Priority ${rawValue}`;
                    badgeEl.classList.remove("none");
                    inputEl.value = rawValue;
                }

                // If we're viewing the priority-ordered list, refresh so the new
                // ordering (and any products that fell out of the top N) is reflected.
                if (priorityMode) {
                    fetchCategoryProductsByPriority();
                }
            } catch (err) {
                console.error("Set priority failed:", err);
                statusEl.textContent = "Could not reach the server";
                statusEl.className = "cat-priority-status err";
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        function renderPagination(current, totalPages, totalProducts) {
            panelPagination.style.display = totalPages > 1 ? "flex" : "none";
            pageInfo.textContent = `Page ${current + 1} of ${totalPages} · ${totalProducts} total`;
            prevBtn.disabled = current <= 0;
            nextBtn.disabled = current >= totalPages - 1;
        }

        // ================= INIT =================
        function init() {
            loadCategorySummary();
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>

    <script>
        window.API_BASE = "https://api.stanvee.com";
        if (!localStorage.getItem("adminSessionToken")) { window.location.href = "index.html"; }
    </script>
    <script src="components/layout.js"></script>

</body>

</html>
