<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import via Excel — Stanvee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ============================================================
     APP SHELL — sidebar + topbar markup is identical on every page.
     No JS: the mobile menu uses a hidden checkbox (#sb-toggle) and
     the Products dropdown uses a native <details> element.
============================================================= -->
    <div id="app-shell">
        <input type="checkbox" id="sb-toggle">
        <label for="sb-toggle" class="sb-overlay"></label>

<!-- ---------- SIDEBAR (shared component, injected by components/layout.js) ---------- -->
        <div id="sidebar-mount"></div>

        <div id="main-wrap">
            <main id="content">
                <div class="page-title">Import via Excel</div>
                <div class="page-sub">Bulk-upload products from a spreadsheet</div>

                <div id="alert-box" style="display:none;margin-bottom:16px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;"></div>

                <div class="card" style="padding:22px;margin-bottom:16px;">
                    <div class="flex" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                        <div>
                            <div style="font-weight:700;font-size:14.5px;">Step 1 — Upload your file</div>
                            <div style="color:var(--text-muted);font-size:12.5px;margin-top:2px;">Accepts .xlsx files only</div>
                        </div>
                        <a class="btn btn-secondary" href="#" id="download-template-btn"><svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Download Template</a>
                    </div>
                </div>

                <div class="card" style="padding:22px;margin-bottom:24px;">
                    <label class="dropzone" for="file-input">
          <svg class="icon" width="40" height="40" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          <div style="font-weight:600;font-size:14px;margin-bottom:4px;" id="dropzone-label">Click to choose your .xlsx file</div>
          <div style="font-size:12.5px;color:var(--text-light);" id="dropzone-sub">or drag &amp; drop here</div>
          <input type="file" id="file-input" accept=".xlsx">
        </label>
                    <div class="flex" style="justify-content:space-between;align-items:center;margin-top:18px;">
                        <label class="checkbox-row"><input type="checkbox" id="preview-checkbox" checked> Preview before importing</label>
                        <button type="button" class="btn btn-primary" id="upload-btn"><svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> <span id="upload-btn-label">Upload &amp; Preview</span></button>
                    </div>
                </div>

                <div class="card" style="padding:22px;display:none;" id="results-card">
                    <div style="font-weight:700;font-size:14.5px;margin-bottom:2px;" id="results-title">Preview Results</div>
                    <div style="color:var(--text-muted);font-size:12.5px;" id="results-sub">Nothing has been saved to the database yet</div>
                    <div class="summary-grid">
                        <div class="card summary-card">
                            <div class="val" id="stat-total">0</div>
                            <div class="lab">Total Rows</div>
                        </div>
                        <div class="card summary-card" style="border-color:#bbf7d0;">
                            <div class="val" style="color:var(--green)" id="stat-success">0</div>
                            <div class="lab" id="stat-success-label">Will Import</div>
                        </div>
                        <div class="card summary-card" style="border-color:#fecaca;">
                            <div class="val" style="color:var(--red)" id="stat-failed">0</div>
                            <div class="lab" id="stat-failed-label">Will Fail</div>
                        </div>
                        <div class="card summary-card">
                            <div class="val" style="color:#d97706" id="stat-skipped">0</div>
                            <div class="lab">Duplicates</div>
                        </div>
                    </div>
                    <div id="issues-section">
                        <div style="font-weight:700;font-size:13px;margin:16px 0 8px;">Issues found</div>
                        <div class="table-wrap" style="border:1px solid var(--border);border-radius:8px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Row Number</th>
                                        <th>Reason</th>
                                    </tr>
                                </thead>
                                <tbody id="issues-tbody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="flex" style="gap:10px;justify-content:flex-end;margin-top:20px;" id="confirm-row">
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirm-import-btn"><svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Confirm Import</button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="components/layout.js"></script>
    <script>
        // ── Config ────────────────────────────────────────────────────────────
        // MUST match orders.html / dashboard.html / pending-checkouts.html.
        // API_BASE is the full Render URL — the admin panel is a static site
        // served from a different origin than the API, so '' (same-origin)
        // never worked here.
        console.log("[import][init] Reading adminSessionToken from localStorage…");
        window.__adminAuth = { token: localStorage.getItem("adminSessionToken") };
        console.log("[import][init] Token found:", window.__adminAuth.token ? window.__adminAuth.token : "(none)");

        // Same guard as every other admin page: no token → bounce to index
        // immediately, so we never fire an API call we know will 401.
        if (!window.__adminAuth.token) {
            console.warn("[import][init] No token present — redirecting to index.html");
            window.location.href = "index.html";
        }

        const API_BASE = "https://api.stanvee.com";
        window.API_BASE = API_BASE;

        function authHeaders(extra) {
            const headers = Object.assign({ "Authorization": window.__adminAuth.token }, extra || {});
            console.log("[import][authHeaders] Built headers:", headers);
            return headers;
        }

        function handleUnauthorized() {
            console.error("[import][handleUnauthorized] 401 received. Current token was:", window.__adminAuth.token);
            window.__adminAuth.token = null;
            localStorage.removeItem("adminSessionToken");
            localStorage.removeItem("adminEmail");
            showAlert("Your session has expired. Redirecting to sign in…", "error");
            setTimeout(function () { window.location.href = "index.html"; }, 900);
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.textContent = message;
            box.style.display = 'block';
            if (type === 'error') {
                box.style.background = '#fef2f2';
                box.style.color = '#b91c1c';
                box.style.border = '1px solid #fecaca';
            } else {
                box.style.background = '#f0fdf4';
                box.style.color = '#15803d';
                box.style.border = '1px solid #bbf7d0';
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').style.display = 'none';
        }

        // ── State ────────────────────────────────────────────────────────────
        let selectedFile = null;
        let lastPreviewWasPreviewMode = true;

        const fileInput       = document.getElementById('file-input');
        const dropzoneLabel   = document.getElementById('dropzone-label');
        const dropzoneSub     = document.getElementById('dropzone-sub');
        const previewCheckbox = document.getElementById('preview-checkbox');
        const uploadBtn       = document.getElementById('upload-btn');
        const uploadBtnLabel  = document.getElementById('upload-btn-label');
        const resultsCard     = document.getElementById('results-card');
        const resultsTitle    = document.getElementById('results-title');
        const resultsSub      = document.getElementById('results-sub');
        const issuesSection   = document.getElementById('issues-section');
        const issuesTbody     = document.getElementById('issues-tbody');
        const confirmRow      = document.getElementById('confirm-row');
        const confirmBtn      = document.getElementById('confirm-import-btn');
        const cancelBtn       = document.getElementById('cancel-btn');
        const downloadBtn     = document.getElementById('download-template-btn');

        // ── Step 1a: Download Template ──────────────────────────────────────
        // GET /api/admin/products/excel/template
        downloadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            hideAlert();
            try {
                const res = await fetch(`${API_BASE}/api/admin/products/excel/template`, {
                    method: 'GET',
                    headers: { ...authHeaders() }
                });
                if (res.status === 401) {
                    handleUnauthorized();
                    return;
                }
                if (!res.ok) {
                    showAlert('Could not download the template. Please try again.', 'error');
                    return;
                }
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'product_import_template.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                console.error("[import] Template download failed:", err);
                showAlert('Network error while downloading the template.', 'error');
            }
        });

        // ── File selection ───────────────────────────────────────────────────
        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0] || null;
            if (selectedFile) {
                dropzoneLabel.textContent = selectedFile.name;
                dropzoneSub.textContent = 'Ready to upload — click "Upload" below';
            } else {
                dropzoneLabel.textContent = 'Click to choose your .xlsx file';
                dropzoneSub.textContent = 'or drag & drop here';
            }
        });

        // ── Step 2: Upload (preview or direct import) ───────────────────────
        // POST /api/admin/products/excel/import  (multipart/form-data: file, preview)
        async function runImport(previewMode) {
            hideAlert();
            if (!selectedFile) {
                showAlert('Please choose an .xlsx file first.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);

            const btnToDisable = previewMode ? uploadBtn : confirmBtn;
            const originalHtml = btnToDisable.innerHTML;
            btnToDisable.disabled = true;
            btnToDisable.innerHTML = previewMode ? 'Uploading…' : 'Importing…';

            try {
                console.log("[import][runImport] preview:", previewMode, "file:", selectedFile.name, "Token:", window.__adminAuth.token);
                const res = await fetch(
                    `${API_BASE}/api/admin/products/excel/import?preview=${previewMode}`,
                    {
                        method: 'POST',
                        headers: { ...authHeaders() }, // do NOT set Content-Type — browser sets the multipart boundary
                        body: formData
                    }
                );

                if (res.status === 401) {
                    console.error("[import][runImport] 401 Unauthorized. Token sent was:", window.__adminAuth.token);
                    handleUnauthorized();
                    return;
                }

                const payload = await res.json();
                console.log("[import][runImport] Response body:", payload);

                if (!res.ok || payload.status !== 'success') {
                    showAlert(
                        typeof payload.data === 'string' ? payload.data : 'Import failed. Please check the file and try again.',
                        'error'
                    );
                    return;
                }

                renderSummary(payload.data, previewMode);
                lastPreviewWasPreviewMode = previewMode;

                if (!previewMode) {
                    showAlert(`Import complete: ${payload.data.success_count} of ${payload.data.total_rows} rows saved.`, 'success');
                    confirmRow.style.display = 'none'; // nothing left to confirm after a real import
                }
            } catch (err) {
                console.error("[import] runImport failed:", err);
                showAlert('Network error while uploading the file.', 'error');
            } finally {
                btnToDisable.disabled = false;
                btnToDisable.innerHTML = originalHtml;
            }
        }

        function renderSummary(summary, previewMode) {
            resultsCard.style.display = 'block';
            resultsTitle.textContent = previewMode ? 'Preview Results' : 'Import Results';
            resultsSub.textContent = previewMode
                ? 'Nothing has been saved yet — review the rows below, then confirm.'
                : 'These rows have been saved to the database.';

            document.getElementById('stat-total').textContent = summary.total_rows;
            document.getElementById('stat-success').textContent = summary.success_count;
            document.getElementById('stat-failed').textContent = summary.failed_count;
            document.getElementById('stat-skipped').textContent = summary.skipped_duplicates;
            document.getElementById('stat-success-label').textContent = previewMode ? 'Will Import' : 'Imported';
            document.getElementById('stat-failed-label').textContent = previewMode ? 'Will Fail' : 'Failed';

            issuesTbody.innerHTML = '';
            const errors = summary.errors || [];
            if (errors.length === 0) {
                issuesSection.style.display = 'none';
            } else {
                issuesSection.style.display = 'block';
                for (const err of errors) {
                    const tr = document.createElement('tr');
                    const tdRow = document.createElement('td');
                    tdRow.textContent = err.row_number;
                    const tdReason = document.createElement('td');
                    tdReason.textContent = err.reason;
                    tr.appendChild(tdRow);
                    tr.appendChild(tdReason);
                    issuesTbody.appendChild(tr);
                }
            }

            // Only show the "Confirm Import" action when we're in preview mode
            // and there's at least one row that would actually import.
            confirmRow.style.display = (previewMode && summary.success_count > 0) ? 'flex' : (previewMode ? 'flex' : 'none');
        }

        uploadBtn.addEventListener('click', () => {
            const previewMode = previewCheckbox.checked;
            runImport(previewMode);
        });

        // ── Step 3: Confirm Import (re-runs the same file with preview=false) ──
        confirmBtn.addEventListener('click', () => {
            runImport(false);
        });

        cancelBtn.addEventListener('click', () => {
            resultsCard.style.display = 'none';
            hideAlert();
        });

        // If the "Preview before importing" checkbox is unchecked, the main
        // button becomes a direct import button.
        previewCheckbox.addEventListener('change', () => {
            uploadBtnLabel.textContent = previewCheckbox.checked ? 'Upload & Preview' : 'Upload & Import';
        });

        // ── Init ──────────────────────────────────────────────────────────
        function init() {
            console.log("[import][init] Ready — token:", window.__adminAuth.token ? "present" : "missing");
        }

        init();
    </script>

</body>

</html>
