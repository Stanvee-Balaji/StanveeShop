<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ - StanveeProducts</title>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap)" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/app.css" />

    <style>
        /*==============================
CONTACT SECTION
==============================*/
        
        .contact-section {
            background: #f5f5f5;
            padding: 70px 15px;
        }
        
        .contact-title {
            text-align: center;
            font-size: 46px;
            font-weight: 700;
            color: #45b649;
            margin-bottom: 40px;
        }
        
        .contact-card {
            max-width: 900px;
            margin: auto;
            background: #fff;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }
        
        .contact-card h3 {
            color: #45b649;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        
        .contact-card h4 {
            color: #45b649;
            font-size: 28px;
            font-weight: 700;
            margin: 35px 0 20px;
        }
        
        .contact-info p {
            font-size: 17px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 22px;
        }
        
        .contact-info strong {
            font-weight: 700;
        }
        
        .contact-info a {
            color: #45b649;
            text-decoration: none;
        }
        
        .contact-info a:hover {
            text-decoration: underline;
        }

        /* Required field marker */
        .required-mark {
            color: #e74c3c;
            font-weight: 700;
            margin-left: 2px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 14px 16px;
            font-size: 16px;
            outline: none;
            transition: .3s;
            box-sizing: border-box;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #45b649;
            box-shadow: 0 0 0 2px rgba(69, 182, 73, .15);
        }

        .contact-form input.field-error,
        .contact-form textarea.field-error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, .12);
        }
        
        .contact-form textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .contact-form button {
            width: 100%;
            border: none;
            background: #45b649;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .contact-form button:hover {
            background: #35963a;
        }

        .contact-form button:disabled {
            background: #9bcf9d;
            cursor: not-allowed;
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            display: none;
            animation: spin .7s linear infinite;
        }

        .contact-form button.loading .btn-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /*==============================
TOAST NOTIFICATIONS
==============================*/
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 360px;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,.15);
            padding: 14px 16px;
            font-size: 15px;
            opacity: 0;
            transform: translateX(40px);
            animation: toast-in .3s ease forwards;
        }

        /* SUCCESS = solid green */
        .toast.toast-success {
            background: #45b649;
            color: #fff;
            border-left: 5px solid #2e8c33;
        }

        /* ERROR = solid red */
        .toast.toast-error {
            background: #e74c3c;
            color: #fff;
            border-left: 5px solid #c0392b;
        }

        /* WARNING = solid amber */
        .toast.toast-warning {
            background: #f39c12;
            color: #fff;
            border-left: 5px solid #c9800a;
        }

        .toast.hide {
            animation: toast-out .3s ease forwards;
        }

        @keyframes toast-in {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            to { opacity: 0; transform: translateX(40px); }
        }

        .toast-icon {
            font-weight: 700;
            font-size: 16px;
            line-height: 1;
            color: #fff;
        }

        .toast-msg {
            flex: 1;
            line-height: 1.4;
            color: #fff;
        }

        .toast-close {
            cursor: pointer;
            color: rgba(255,255,255,.85);
            font-size: 16px;
            line-height: 1;
        }

        .toast-close:hover { color: #fff; }

        /* Responsive */
        
        @media(max-width:768px) {
            .contact-section {
                padding: 50px 15px;
            }
            .contact-card {
                padding: 25px;
            }
            .contact-title {
                font-size: 34px;
            }
            .contact-card h3 {
                font-size: 24px;
            }
            .contact-card h4 {
                font-size: 22px;
            }
            .contact-info p {
                font-size: 15px;
            }
            #toast-container {
                left: 15px;
                right: 15px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <div id="header"></div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- CONTACT SECTION START -->
    <section class="contact-section">
        <div class="container">
            <h2 class="contact-title">Contact Us</h2>

            <div class="contact-card">

                <h3>Stanvee Services India Limited</h3>

                <div class="contact-info">

                    <p>
                        <strong>ADDRESS:</strong> 403, Metropolis, Balewadi High Street, Baner, 411045
                    </p>

                    <p>
                        <strong>MOBILE NO:</strong><br> +91 92705 11515 (Time: 10:30 AM to 7:00 PM)<br> +91 92705 11515 (24x6)
                    </p>

                    <p>
                        <strong>EMAIL:</strong>
                        <a href="mailto:info@stanvee.com">info@stanvee.com</a>
                    </p>

                    <p>
                        <strong>WORKING HOURS:</strong> Mon – Sat 10:00 AM to 6:00 PM | Sundays Closed & Holidays
                    </p>

                </div>

                <h4>Get in Touch</h4>

                <form id="contactForm" class="contact-form" novalidate>

                    <div class="form-group">
                        <label class="form-label" for="cf-name">Your Name<span class="required-mark">*</span></label>
                        <input type="text" id="cf-name" name="name" placeholder="Your Name" required>
                    </div>

                 <div class="form-group">
                        <label class="form-label" for="cf-userid">User ID<span class="required-mark">*</span></label>
                        <input type="text" id="cf-userid" name="user_id" placeholder="User ID" required readonly>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cf-orderid">Order ID <em style="color:#999; font-weight:400;">(optional)</em></label>
                        <input type="text" id="cf-orderid" name="order_id" placeholder="Order ID (if applicable)">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cf-email">Your Email<span class="required-mark">*</span></label>
                        <input type="email" id="cf-email" name="email" placeholder="Your Email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cf-mobile">Mobile Number<span class="required-mark">*</span></label>
                        <input type="tel" id="cf-mobile" name="mobile" placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cf-message">Your Message<span class="required-mark">*</span></label>
                        <textarea id="cf-message" name="message" rows="6" placeholder="Your Message" required></textarea>
                    </div>

                    <button type="submit" id="cf-submit-btn">
                        <span class="btn-spinner"></span>
                        <span class="btn-text">Send Message</span>
                    </button>

                </form>

            </div>
        </div>
    </section>
    <!-- CONTACT SECTION END -->


    <script>
        // ==========================================================
        // CONFIG — switch BASE_URL when moving to staging/production
        // ==========================================================
        const API_CONFIG = {
            BASE_URL: "https://api.stanveeshop.com", // TODO: replace with actual environment host later
            CONTACT_SUBMIT_ENDPOINT: "/api/contact/submit"
        };

        // ==========================================================
        // TOAST HELPER
        // ==========================================================
        function showToast(message, type = "success", duration = 4000) {
            const container = document.getElementById("toast-container");

            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;

            const icon = type === "success" ? "✓" : type === "error" ? "✕" : "!";

            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-msg"></span>
                <span class="toast-close">&times;</span>
            `;
            // set message via textContent to avoid HTML injection
            toast.querySelector(".toast-msg").textContent = message;

            const removeToast = () => {
                toast.classList.add("hide");
                setTimeout(() => toast.remove(), 300);
            };

            toast.querySelector(".toast-close").addEventListener("click", removeToast);
            container.appendChild(toast);

            setTimeout(removeToast, duration);
        }

        // ==========================================================
        // FORM VALIDATION + SUBMIT
        // ==========================================================
        (function () {
            const form = document.getElementById("contactForm");
            const submitBtn = document.getElementById("cf-submit-btn");

            const fields = {
                name: document.getElementById("cf-name"),
                user_id: document.getElementById("cf-userid"),
                order_id: document.getElementById("cf-orderid"), // optional
                email: document.getElementById("cf-email"),
                mobile: document.getElementById("cf-mobile"),
                message: document.getElementById("cf-message")
            };

            // ── AUTO-FILL USER ID + EMAIL FROM LOGGED-IN SESSION ──
            // User ID should never be manually typed — it's tied to the
            // logged-in account. Pull it (and email, if available) from
            // the same localStorage session key script.js/include.js use.
            (function prefillFromSession() {
                const savedUser = localStorage.getItem("stanveeUser");
                const loggedIn = localStorage.getItem("stanveeLoggedIn");
                if (loggedIn === "true" && savedUser) {
                    try {
                        const user = JSON.parse(savedUser);
                        if (user.loginid) {
                            fields.user_id.value = user.loginid;
                        }
                        if (user.name && !fields.name.value) {
                            fields.name.value = user.name;
                        }
                        if (user.email && !fields.email.value) {
                            fields.email.value = user.email;
                        }
                    } catch (e) {
                        console.error("[Contact Form] Failed to prefill from session:", e);
                    }
                }
            })();

            function clearFieldErrors() {
                Object.values(fields).forEach(el => el.classList.remove("field-error"));
            }

            function validateForm() {
                clearFieldErrors();

                // Order ID is intentionally excluded — it's optional per API
                const requiredChecks = [
                    { el: fields.name, label: "Your Name" },
                    { el: fields.user_id, label: "User ID" },
                    { el: fields.email, label: "Your Email" },
                    { el: fields.mobile, label: "Mobile Number" },
                    { el: fields.message, label: "Your Message" }
                ];

                for (const check of requiredChecks) {
                    if (!check.el.value.trim()) {
                        check.el.classList.add("field-error");
                        showToast(`${check.label} is required.`, "warning");
                        check.el.focus();
                        return false;
                    }
                }

                // basic email format check
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(fields.email.value.trim())) {
                    fields.email.classList.add("field-error");
                    showToast("Please enter a valid email address.", "warning");
                    fields.email.focus();
                    return false;
                }

                // basic mobile number check (10 digits)
                const mobilePattern = /^[0-9]{10}$/;
                if (!mobilePattern.test(fields.mobile.value.trim())) {
                    fields.mobile.classList.add("field-error");
                    showToast("Please enter a valid 10-digit mobile number.", "warning");
                    fields.mobile.focus();
                    return false;
                }

                return true;
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.classList.toggle("loading", isLoading);
                submitBtn.querySelector(".btn-text").textContent = isLoading ? "Sending..." : "Send Message";
            }

            async function submitContactForm(payload) {
                const url = API_CONFIG.BASE_URL + API_CONFIG.CONTACT_SUBMIT_ENDPOINT;

                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    throw new Error("Unexpected response from server. Please try again later.");
                }

                if (!response.ok || !data.success) {
                    // API returns { success:false, message, data:null } on validation errors (400)
                    throw new Error(data.message || "Something went wrong. Please try again.");
                }

                return data;
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                if (!validateForm()) return;

                const payload = {
                    name: fields.name.value.trim(),
                    userId: fields.user_id.value.trim(),
                    orderId: fields.order_id.value.trim() || null, // optional field
                    email: fields.email.value.trim(),
                    mobileNumber: fields.mobile.value.trim(),
                    message: fields.message.value.trim()
                };

                setLoading(true);

                try {
                    const result = await submitContactForm(payload);
                    showToast(
                        result.message || "Your message has been received. Our team will get back to you shortly.",
                        "success"
                    );
                    form.reset();
                } catch (err) {
                    showToast(err.message || "Failed to send your message. Please try again.", "error");
                } finally {
                    setLoading(false);
                }
            });
        })();

        function toggleFaq(element) {
            const faqItem = element.parentElement;
            const isActive = faqItem.classList.contains('active');

            // Close all FAQ items
            document.querySelectorAll('.faq-item').forEach(item => {
                item.classList.remove('active');
            });

            // Open clicked item if it wasn't already open
            if (!isActive) {
                faqItem.classList.add('active');
            }
        }
    </script>
    <div id="footer"></div>
    <script src="js/script.js"></script>
    <script src="js/app-data.js"></script>
    <script src="js/include.js"></script>

</body>

</html>
