<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ - StanveeProducts</title>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap)" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/app.css" />

    <style>
        /*==============================
CONTACT SECTION
==============================*/
        
        .contact-section {
            background: #f5f5f5;
            padding: 70px 15px;
        }
        
        .contact-title {
            text-align: center;
            font-size: 46px;
            font-weight: 700;
            color: #45b649;
            margin-bottom: 40px;
        }
        
        .contact-card {
            max-width: 900px;
            margin: auto;
            background: #fff;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }
        
        .contact-card h3 {
            color: #45b649;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        
        .contact-card h4 {
            color: #45b649;
            font-size: 28px;
            font-weight: 700;
            margin: 35px 0 20px;
        }
        
        .contact-info p {
            font-size: 17px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 22px;
        }
        
        .contact-info strong {
            font-weight: 700;
        }
        
        .contact-info a {
            color: #45b649;
            text-decoration: none;
        }
        
        .contact-info a:hover {
            text-decoration: underline;
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 16px;
            outline: none;
            transition: .3s;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #45b649;
            box-shadow: 0 0 0 2px rgba(69, 182, 73, .15);
        }
        
        .contact-form textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .contact-form button {
            width: 100%;
            border: none;
            background: #45b649;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: .3s;
        }
        
        .contact-form button:hover {
            background: #35963a;
        }
        /* Responsive */
        
        @media(max-width:768px) {
            .contact-section {
                padding: 50px 15px;
            }
            .contact-card {
                padding: 25px;
            }
            .contact-title {
                font-size: 34px;
            }
            .contact-card h3 {
                font-size: 24px;
            }
            .contact-card h4 {
                font-size: 22px;
            }
            .contact-info p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="header"></div>

    <!-- CONTACT SECTION START -->
    <section class="contact-section">
        <div class="container">
            <h2 class="contact-title">Contact Us</h2>

            <div class="contact-card">

                <h3>Stanvee Services India Limited</h3>

                <div class="contact-info">

                    <p>
                        <strong>ADDRESS:</strong> 403, Metropolis, Balewadi High Street, Baner, 411045
                    </p>

                    <p>
                        <strong>MOBILE NO:</strong><br> +91 92705 21515 (Time: 10:30 AM to 7:00 PM)<br> +91 92705 11515 (24x6)
                    </p>

                    <p>
                        <strong>EMAIL:</strong>
                        <a href="mailto:info@stanvee.com">info@stanvee.com</a>
                    </p>

                    <p>
                        <strong>WORKING HOURS:</strong> Mon – Sat 10:00 AM to 6:00 PM | Sundays Closed & Holidays
                    </p>

                </div>

                <h4>Get in Touch</h4>

                <form action="#" method="post" class="contact-form">

                    <input type="text" name="name" placeholder="Your Name" required>

                    <input type="email" name="email" placeholder="Your Email" required>

                    <textarea name="message" rows="6" placeholder="Your Message" required></textarea>

                    <button type="submit">
                    Send Message
                </button>

                </form>

            </div>
        </div>
    </section>
    <!-- CONTACT SECTION END -->


    <script>
        function toggleFaq(element) {
            const faqItem = element.parentElement;
            const isActive = faqItem.classList.contains('active');

            // Close all FAQ items
            document.querySelectorAll('.faq-item').forEach(item => {
                item.classList.remove('active');
            });

            // Open clicked item if it wasn't already open
            if (!isActive) {
                faqItem.classList.add('active');
            }
        }
    </script>
    <div id="footer"></div>
    <script src="js/script.js"></script>
    <script src="js/app-data.js"></script>
    <script src="js/include.js"></script>

</body>

</html>
